[package]
name = "frida-barebone-agent"
version = "1.0.0"
edition = "2024"
build = "build.rs"

[lib]
name = "frida_barebone_agent"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

# The XNU flavour is a freestanding executable the host injects and calls into.
# The Linux flavour is the staticlib above, linked into a .ko by linux/Kbuild.
[[bin]]
name = "frida-barebone-agent"
path = "src/main.rs"
required-features = ["blob"]

[features]
# Flavors the host injects and calls into, as opposed to the module Linux loads.
blob = []
xnu = ["blob"]
win9x = ["blob"]
linux = []

[profile.release]
panic = "abort"
opt-level = "z"
overflow-checks = false
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"

[build-dependencies]
cc = "1.2"
bindgen = "0.72.0"
